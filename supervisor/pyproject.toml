# The supervisor: watchdog, backups and self-updater (SPEC §2.1, §3.2.12; CONVENTIONS §12).
# A separate program with its own pinned Python and venv, standard library only, never a workspace member of the
# app, never importing `yordamchi` (A6), and never upgraded in the same update as the app (R-32).
[project]
name = "yordamchi-supervisor"
version = "0.1.0"
description = "Yordamchi watchdog and self-updater (stdlib only)"
requires-python = "==3.12.*"
dependencies = []

[build-system]
requires = ["uv_build>=0.13,<0.14"]
build-backend = "uv_build"
