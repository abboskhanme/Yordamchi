# Alembic for dev.db and personal.db: one chain, `upgrade head` run on each file (SPEC §2.3).
#   uv run alembic -x db=dev upgrade head              # DATA/db/dev.db (YORDAMCHI_DATA_DIR overrides DATA)
#   uv run alembic -x db=personal upgrade head
#   uv run alembic -x db=/path/to/file.db upgrade head  # any file (the supervisor, make check)
# Bots never migrate; the installer and the supervisor do (SPEC §2.5 step 5).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
file_template = %%(rev)s_%%(slug)s
truncate_slug_length = 60
path_separator = os

[post_write_hooks]
# A generated revision must pass `make check` unedited (TASKS migration plan).
hooks = ruff_fix, ruff_format
ruff_fix.type = module
ruff_fix.module = ruff
ruff_fix.options = check --fix --quiet REVISION_SCRIPT_FILENAME
ruff_format.type = module
ruff_format.module = ruff
ruff_format.options = format --quiet REVISION_SCRIPT_FILENAME

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
