  - id: complete_question_after_a_photo
    labels: [interpretable, no_question_needed]
    parts:
      - {t: 0, kind: photo}
      - {t: 3, kind: text, text: "Bu xato nimadan chiqdi?"}
    expect:
      bursts:
        - {parts: [0, 1], closes_t: 4.2, reason: quiet}

  - id: other_kind_waits_like_text
    parts:
      - {t: 0, kind: other}
    expect:
      bursts:
        - {parts: [0], closes_t: 2.0, reason: quiet, kinds: [other]}

  - id: link_then_its_explanation
    labels: [interpretable, no_question_needed]
    parts:
      - {t: 0, kind: link, text: "https://bonvi.uz/hr/login"}
      - {t: 5, kind: text, text: "shu sahifa ochilmayapti"}
