# Secrets eval cases (UC-04, NFR-SEC-03; SPEC §4.5, §3.2.1 step 3). T27. Runner: `test_secrets_eval.py`.
# `thresholds.toml` [secrets]: formats_min = 10, plaintext_hits_max = 0, unknown_format_leaks_max = 0.
#
# Every key here is fake, in its vendor's real shape. Each `value` is written as fragments the runner joins with
# nothing in between, so no secret scanner flags this file. A value never holds `"`, `\`, `<`, `>` or `&`, so a JSON- or
# HTML-escaped copy of it is the same text and the leak search cannot miss one.
#
# A case is one owner message, sent on each bot:
#   id
#   context   prose | code | url | caption | edited | free_text   where the key sits (free_text: typed outside any
#             command, with no keyword next to it)
#   field     text (default) | caption (a photo's caption) | edited (an edited text message)
#   message   the text; `<<0>>`, `<<1>>`, … stand for keys[0], keys[1], …
#   keys[]    kind     the `core.redact` kind it is stored as; `unknown` for a key no pattern knows
#             outcome  stored (default) | refused (a Claude login token: never stored) | undetected
#             value    the fragments of the key
#   known_bug optional: {id, leaks, note} for a case that fails on a reported, unfixed bug. The case keeps its full
#             expectations and runs as a strict xfail, so it fails loudly once the bug is fixed and the entry must go.
#             `leaks: true`: the bug puts plaintext somewhere, so the suite misses plaintext_hits_max until it is fixed.
#
# Known bugs (found by T27, both in protected core `src/yordamchi/core/redact.py`; reported, not fixed here):
#   T27-B1  Scrubbing re-matches intake's own marker. `inbox.service._record` scrubs the redacted text
#           (`payload_json(content, redact.scrubbed)`), and the burst and the outbox scrub it again. The marker
#           `[kalit: github_token ••••c2Gc]` holds a generic keyword ("token", "api_key", "secret", "key"), so when
#           non-space text follows it (a URL), `generic_secret` (redact.py:119-124) masks the marker's tail and the
#           rest of the URL: "https://[kalit: github_token ••••.git". After "api.telegram.org/bot", `telegram_bot_url`
#           (redact.py:113-118) masks "[kalit:". No plaintext leaks; the owner's text is cut and the marker broken.
#   T27-B2  `generic_secret` (redact.py:121, value `[^\s"'`]{24,}`) runs on past `&` in a URL query, so the vault
#           stores "<key>&channel=dev": the masked tail is "••••=dev", secret-hashes.json holds the wrong hash (the
#           pre-push scan misses the real key), and the masking set lacks the real key, so model output that repeats
#           it reaches Telegram and the outbox row in plaintext.

