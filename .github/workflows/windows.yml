# Windows: the personal bot only (README "Windows: personal bot only"). The Windows code paths are not type-checked or
# run on the owner's Mac, so this job is their only real check: the Windows unit tests, a non-interactive setup with a
# fake token, and the bot's --dry-run (everything up to the tool check: no model, no poll, no message).
# `--allow-hosts`: Windows' event loop builds its wake-up pipe from a localhost socketpair, which `--disable-socket`
# forbids; with it, sockets exist but connect only to this machine, so the network stays closed.
name: windows

on:
  workflow_dispatch:
  push:
    branches: [main, "ci/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  personal-bot:
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv sync --frozen

      - name: Windows unit tests
        run: >
          uv run pytest -q -p no:cacheprovider --allow-hosts=127.0.0.1,::1
          tests/unit/core/test_windows.py
          tests/unit/adapters/test_windows_adapters.py
          tests/unit/bots/personal/test_app_windows.py
          tests/unit/ops/test_windows_setup.py
          tests/unit/ops/test_windows_run.py

      - name: Setup with a fake token
        shell: pwsh
        run: |
          $token = "123456789:" + ("A" * 35)
          $token | uv run python scripts\windows\setup.py --owner-id 1 --token-stdin

      - name: Dry run
        shell: pwsh
        run: |
          # A stand-in `claude` so the start-up binary check passes; the dry run never launches it.
          $fake = Join-Path $env:RUNNER_TEMP "fake-claude"
          New-Item -ItemType Directory -Force -Path $fake | Out-Null
          Set-Content -Path (Join-Path $fake "claude.cmd") -Value "@echo 2.1.0 (Claude Code)"
          $env:PATH = "$fake;$env:PATH"
          uv run python -m yordamchi.bots.personal.app --dry-run

  # Everything the personal bot runs on, under Windows: its features, the shared ones (voice, settings, vault, outbox),
  # the adapters (Gemini, OpenRouter, Telegram, Claude) and its integration tests. The dev bot and the supervisor are
  # macOS-only and stay out.
  personal-suite:
    runs-on: windows-latest
    timeout-minutes: 40
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv sync --frozen

      - name: Personal bot tests
        run: >
          uv run pytest -q -p no:cacheprovider -rfE --tb=short --allow-hosts=127.0.0.1,::1 --junitxml=suite.xml
          tests/unit/personal tests/unit/shared tests/unit/core tests/unit/adapters tests/unit/bots/personal
          tests/unit/persistence tests/unit/test_golden_messages.py
          tests/integration/test_claude_assistant.py tests/integration/test_claude_assistant_agent.py
          tests/integration/test_claude_assistant_qa.py tests/integration/test_claude_context.py
          tests/integration/test_edge_tts.py tests/integration/test_forward_translation.py
          tests/integration/test_gemini.py tests/integration/test_gemini_assistant.py
          tests/integration/test_gemini_live.py tests/integration/test_gemini_tts.py
          tests/integration/test_gemini_video.py tests/integration/test_integrations_oauth.py
          tests/integration/test_live_key.py tests/integration/test_mcp.py tests/integration/test_office.py
          tests/integration/test_openrouter.py tests/integration/test_openrouter_tts.py
          tests/integration/test_openrouter_video.py tests/integration/test_owner_only.py
          tests/integration/test_personal_agent.py tests/integration/test_personal_bot.py
          tests/integration/test_personal_bot_talk.py tests/integration/test_polling.py
          tests/integration/test_telegram.py tests/integration/test_tts_ffmpeg.py tests/integration/test_web.py
          tests/integration/test_web_page.py

      # The console log of a large failing run gets cut; the XML keeps every failure and its traceback.
      - name: Keep the results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: personal-suite-results
          path: suite.xml
          if-no-files-found: ignore
